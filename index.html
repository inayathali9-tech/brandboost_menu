<!doctype html>
<html lang="en" data-state="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mandi &amp; Co. Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column. A coloured header and sticky category bar sit over a warm page; each dish is a soft card (text left, photo right). Each cafe can choose its own three colours in its panel; the page works out the rest. */
:root {
  --bg: #FFF1DC;
  --surface: #FFF8EC;
  --ink: #2A160E;
  --muted: #7B5B4C;
  --line: #EBCFA9;
  --bar: #8E1409;
  --on-bar: #FFF1DC;
  --chip-line: #C0503C;
  --price: #B5200F;
  --saffron: #F4A300;
  --on-saffron: #2A160E;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D110B;
    --surface: #2A1912;
    --ink: #FBEAD3;
    --muted: #C9A892;
    --line: #4A3226;
    --bar: #5E1209;
    --on-bar: #FFF1DC;
    --chip-line: #94402F;
    --price: #FF7A5C;
    --saffron: #FFB830;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D110B;
  --surface: #2A1912;
  --ink: #FBEAD3;
  --muted: #C9A892;
  --line: #4A3226;
  --bar: #5E1209;
  --on-bar: #FFF1DC;
  --chip-line: #94402F;
  --price: #FF7A5C;
  --saffron: #FFB830;
  color-scheme: dark;
}

/* While the menu is loading, stay neutral so a cafe's own colours do not flash red first. */
html[data-state="loading"][lang] {
  --bar: #3A3430;
  --on-bar: #FFF8EF;
  --chip-line: #5B534D;
  --saffron: #CFC6BC;
  --on-saffron: #2A160E;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bar);
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p { margin: 0; }

/* Header */
.top { background: var(--bar); color: var(--on-bar); }
.top .wrap { padding-block: 26px 22px; display: flex; flex-direction: column; gap: 8px; }
.eyebrow {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--saffron);
}
.top h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2.2rem, 9vw, 3.1rem);
  line-height: 1;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.top .tagline { font-size: 1rem; opacity: 0.9; max-width: 34ch; text-wrap: balance; }

/* Sticky category bar */
.tabs-bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bar);
  border-top: 1px solid var(--chip-line);
}
.tabs {
  display: flex; gap: 8px;
  overflow-x: auto;
  padding-block: 10px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none;
  font: inherit;
  font-weight: 600;
  font-size: 0.92rem;
  color: var(--on-bar);
  background: transparent;
  border: 1px solid var(--chip-line);
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
  white-space: nowrap;
}
.tab[aria-current="true"] { background: var(--saffron); border-color: var(--saffron); color: var(--on-saffron); }
.tab:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }

/* Menu sections */
main { padding-block: 8px 28px; }
.sec { scroll-margin-top: calc(64px + env(safe-area-inset-top, 0px)); padding-top: 28px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec h2 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.6rem;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.sec h2::after { content: ""; display: block; width: 34px; height: 4px; border-radius: 4px; background: var(--saffron); margin-top: 7px; }
.count { font-size: 0.8rem; color: var(--muted); font-weight: 600; white-space: nowrap; }
.blurb { color: var(--muted); font-size: 0.92rem; margin-top: 8px; max-width: 52ch; }

.item {
  display: flex; gap: 14px; align-items: flex-start;
  padding: 14px;
  margin-top: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
}
.sec-head + .item, .blurb + .item { margin-top: 16px; }
.info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.nameline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.item h3 { font-size: 1.05rem; font-weight: 700; line-height: 1.25; }
.tag {
  font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 999px;
  background: var(--saffron); color: var(--on-saffron);
}
.desc { color: var(--muted); font-size: 0.9rem; max-width: 46ch; }
.prices { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 3px; }
.price { font-family: var(--font-display); font-weight: 800; font-size: 1.08rem; color: var(--price); font-variant-numeric: tabular-nums; }
.price small { font-family: var(--font-body); font-weight: 600; font-size: 0.74rem; color: var(--muted); margin-right: 5px; text-transform: uppercase; letter-spacing: 0.05em; }

/* Dish picture. Each category has a drawn illustration; give any dish an img URL in MENU below and a real photo replaces it. */
.tile {
  flex: none;
  width: 100px; height: 100px;
  border-radius: 14px;
  overflow: hidden;
  display: grid; place-items: center;
  background: linear-gradient(140deg, var(--ta), var(--tb));
}
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile svg { width: 100%; height: 100%; display: block; }

/* Footer */
footer { background: var(--bar); color: var(--on-bar); }
footer .wrap { padding-block: 20px 24px; display: flex; flex-direction: column; gap: 4px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; }
.brand span { color: var(--saffron); }
footer p { font-size: 0.84rem; opacity: 0.85; max-width: 46ch; }
.mail { user-select: all; font-weight: 600; }

/* Shown instead of the menu when a cafe's plan has lapsed (after the grace days). */
.locked { padding-block: 64px 80px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.locked svg { width: 46px; height: 46px; color: var(--muted); }
.locked h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; text-wrap: balance; }
.locked p { color: var(--muted); max-width: 32ch; text-wrap: balance; }

@media (min-width: 560px) {
  .tile { width: 116px; height: 116px; }
}

body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.item.sold .info, .item.sold .tile { opacity: 0.5; }
@media (prefers-reduced-motion: no-preference) {
  .tab, .lnk { transition: background-color 0.15s, border-color 0.15s; }
}
.tag.out { background: var(--line); color: var(--muted); }

.links { padding-block: 6px 30px; }
.links h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em; }
.linkrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.lnk {
  display: inline-flex; align-items: center; gap: 9px;
  min-height: 48px; padding: 0 18px;
  border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--ink);
  font-weight: 700; font-size: 0.95rem; text-decoration: none;
}
.lnk svg { width: 20px; height: 20px; flex: none; }
.lnk.review { background: var(--saffron); border-color: var(--saffron); color: var(--on-saffron); }
.lnk:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <p class="eyebrow">Menu</p>
    <h1 id="rname">Menu</h1>
    <p class="tagline" id="rtag" hidden></p>
  </div>
</header>

<nav class="tabs-bar" aria-label="Menu categories">
  <div class="wrap"><div class="tabs" id="tabs"></div></div>
</nav>

<main>
  <div class="wrap" id="menu"></div>
  <section class="locked wrap" id="locked" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
    <h2>Menu temporarily unavailable</h2>
    <p>Please ask our staff for the menu. Sorry for the trouble.</p>
  </section>
</main>

<section class="links wrap" id="links" hidden>
  <h2>Find us</h2>
  <div class="linkrow" id="linkrow"></div>
</section>

<footer>
  <div class="wrap">
    <div class="brand">Brand Boost <span>Studio</span></div>
    <p>Want a menu like this for your restaurant? <span class="mail">brandbooststudio110@gmail.com</span></p>
  </div>
</footer>

<script type="module">
import { RID, start } from "./firebase-config.js";
import { applyTheme, subStatus, rupees } from "./shared.js";

var ART = {
  mandi: '<svg viewBox="0 0 96 96" aria-hidden="true"><ellipse cx="48" cy="64" rx="42" ry="15" fill="#fff" fill-opacity="0.92"/><ellipse cx="48" cy="61" rx="33" ry="10" fill="#F2D9A0"/><path d="M20 60c4-26 52-26 56 0z" fill="#F3D48A"/><path d="M29 55c3-16 35-16 38 0z" fill="#F9E8B9"/><ellipse cx="38" cy="40" rx="12" ry="7.5" fill="#8A3F14" transform="rotate(-22 38 40)"/><ellipse cx="59" cy="38" rx="11" ry="7" fill="#A64F1B" transform="rotate(16 59 38)"/><ellipse cx="38" cy="38" rx="6" ry="2.5" fill="#C9743A" transform="rotate(-22 38 38)"/><circle cx="30" cy="57" r="2.2" fill="#2E7D32"/><circle cx="66" cy="56" r="2.2" fill="#2E7D32"/><circle cx="48" cy="50" r="2.4" fill="#D32F2F"/><circle cx="54" cy="53" r="1.8" fill="#7B3F12"/></svg>',
  burgers: '<svg viewBox="0 0 96 96" aria-hidden="true"><path d="M16 46c0-18 14-28 32-28s32 10 32 28z" fill="#E59A3B"/><path d="M22 40c4-10 14-16 26-16" stroke="#F4BD6A" stroke-width="3" stroke-linecap="round" fill="none"/><ellipse cx="36" cy="31" rx="2.4" ry="1.4" fill="#FFF1C9"/><ellipse cx="49" cy="25" rx="2.4" ry="1.4" fill="#FFF1C9"/><ellipse cx="61" cy="33" rx="2.4" ry="1.4" fill="#FFF1C9"/><path d="M12 50c6 6 10-2 16 2s10-4 16 0 10-4 16 0 10-4 16 0v-5H12z" fill="#5FAE3A"/><path d="M14 51h68l-9 8H24z" fill="#F7C52D"/><rect x="14" y="58" width="68" height="10" rx="5" fill="#6B2E12"/><path d="M16 71h64c0 8-6 12-14 12H30c-8 0-14-4-14-12z" fill="#D98A2B"/></svg>',
  wraps: '<svg viewBox="0 0 96 96" aria-hidden="true"><g transform="rotate(-32 48 50)"><rect x="18" y="29" width="56" height="40" rx="20" fill="#F1D9A8"/><ellipse cx="74" cy="49" rx="9.5" ry="20" fill="#E8C98A"/><ellipse cx="74" cy="49" rx="6.5" ry="15" fill="#9C4A1C"/><circle cx="74" cy="42" r="3.2" fill="#5FAE3A"/><circle cx="74" cy="51" r="3.2" fill="#D8412F"/><circle cx="73" cy="57" r="2.4" fill="#F7E7B0"/><path d="M18 44h30v25H38c-11 0-20-4-20-12z" fill="#fff" fill-opacity="0.88"/><path d="M26 44v25M34 44v25M42 44v25" stroke="#D9D2C2" stroke-width="1.2"/></g></svg>',
  pizza: '<svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="40" fill="#D9923B"/><circle cx="48" cy="48" r="34" fill="#D8412F"/><circle cx="48" cy="48" r="31" fill="#F7D774"/><circle cx="35" cy="37" r="6.5" fill="#B5391C"/><circle cx="60" cy="35" r="6.5" fill="#B5391C"/><circle cx="64" cy="58" r="6.5" fill="#B5391C"/><circle cx="39" cy="62" r="6.5" fill="#B5391C"/><circle cx="49" cy="48" r="4" fill="#4C9A2A"/><circle cx="27" cy="50" r="3" fill="#4C9A2A"/><circle cx="70" cy="44" r="3" fill="#4C9A2A"/><path d="M48 48V10M48 48l33 19M48 48L15 67" stroke="#C97B2B" stroke-width="1.6" opacity="0.65"/></svg>',
  drinks: '<svg viewBox="0 0 96 96" aria-hidden="true"><path d="M26 22h42l-5 60c0 3-2 5-5 5H36c-3 0-5-2-5-5z" fill="#fff" fill-opacity="0.38"/><path d="M30 40h35l-3 42c0 2-2 3-4 3H37c-2 0-4-1-4-3z" fill="#F6B73C"/><rect x="38" y="46" width="11" height="11" rx="2.5" fill="#fff" fill-opacity="0.6" transform="rotate(12 43 51)"/><rect x="50" y="59" width="10" height="10" rx="2.5" fill="#fff" fill-opacity="0.55" transform="rotate(-10 55 64)"/><path d="M56 40L63 9h8" stroke="#D8412F" stroke-width="4" stroke-linecap="round" fill="none"/><circle cx="69" cy="30" r="11" fill="#7DBE3E"/><circle cx="69" cy="30" r="8" fill="#C6E27A"/><path d="M69 22v16M61 30h16M63 24l12 12M75 24L63 36" stroke="#7DBE3E" stroke-width="1.2"/></svg>'
};

var GENERIC = '<svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="38" fill="#fff" fill-opacity="0.22"/><circle cx="48" cy="48" r="27" fill="#fff" fill-opacity="0.32"/><circle cx="48" cy="48" r="15" fill="#fff" fill-opacity="0.45"/></svg>';
var DEFAULT_TILE = ["#E5532D", "#A01F10"];

var menuEl = document.getElementById("menu");
var tabsEl = document.getElementById("tabs");
var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var observer = null;

function esc(t) {
  return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function safeImg(u) {
  u = String(u || "").trim();
  return /^(https:\/\/|data:image\/)/i.test(u) ? u : "";
}

var IC_IG = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg>';
var IC_WA = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20l1.4-4.2A8 8 0 1 1 8.3 18.7z"/><path d="M9.2 8.6c.4 2.8 2.4 4.9 5.4 5.8l1.2-1.4-2-1-.9.8c-.9-.4-1.7-1.2-2.1-2.1l.8-.9-1-2z" fill="currentColor" stroke="none"/></svg>';
var IC_STAR = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2 6.4 20.2l1.1-6.3L2.9 9.5l6.3-.9z"/></svg>';

function igUrl(v) {
  v = String(v || "").trim();
  if (!v) return "";
  var m = v.match(/instagram\.com\/([A-Za-z0-9._]+)/i);
  if (m) return "https://instagram.com/" + m[1];
  if (/^https?:\/\//i.test(v)) return "";
  v = v.replace(/^@/, "").replace(/[^A-Za-z0-9._]/g, "");
  return v ? "https://instagram.com/" + v : "";
}
function waUrl(v) {
  var d = String(v || "").replace(/\D/g, "");
  if (d.length === 10) d = "91" + d;
  return d.length >= 11 && d.length <= 15 ? "https://wa.me/" + d : "";
}
function revUrl(v) { v = String(v || "").trim(); return /^https:\/\//i.test(v) ? v : ""; }

function renderLinks(links) {
  links = links || {};
  var out = [];
  var ig = igUrl(links.instagram), wa = waUrl(links.whatsapp), rv = revUrl(links.review);
  if (ig) out.push('<a class="lnk" href="' + esc(ig) + '" target="_blank" rel="noopener">' + IC_IG + "Instagram</a>");
  if (wa) out.push('<a class="lnk" href="' + esc(wa) + '" target="_blank" rel="noopener">' + IC_WA + "WhatsApp</a>");
  if (rv) out.push('<a class="lnk review" href="' + esc(rv) + '" target="_blank" rel="noopener">' + IC_STAR + "Review us on Google</a>");
  document.getElementById("linkrow").innerHTML = out.join("");
  document.getElementById("links").hidden = !out.length;
}

function itemHTML(it, cat) {
  var src = safeImg(it.img);
  var photo = src ? '<img src="' + esc(src) + '" alt="' + esc(it.n) + '" loading="lazy">' : (ART[cat.id] || GENERIC);
  var tag = it.sold ? '<span class="tag out">Sold out</span>' : (it.t ? '<span class="tag">' + esc(it.t) + "</span>" : "");
  var prices = (it.p || []).map(function (x) {
    return '<span class="price">' + (x.l ? "<small>" + esc(x.l) + "</small>" : "") + rupees(x.v) + "</span>";
  }).join("");
  var tile = cat.tile || DEFAULT_TILE;
  return '<article class="item' + (it.sold ? " sold" : "") + '">' +
    '<div class="info">' +
      '<div class="nameline"><h3>' + esc(it.n) + "</h3>" + tag + "</div>" +
      (it.d ? '<p class="desc">' + esc(it.d) + "</p>" : "") +
      '<div class="prices">' + prices + "</div>" +
    "</div>" +
    '<div class="tile" style="--ta:' + esc(tile[0]) + ";--tb:" + esc(tile[1]) + '">' + photo + "</div>" +
  "</article>";
}

function ready() { document.documentElement.removeAttribute("data-state"); }

function render(data) {
  ready();
  applyTheme(document.documentElement, data.theme, document.documentElement);
  document.getElementById("rname").textContent = data.name || "Menu";
  if (subStatus(data.sub).state === "locked") {
    document.title = (data.name || "Menu") + " Menu";
    menuEl.innerHTML = "";
    tabsEl.innerHTML = "";
    document.getElementById("links").hidden = true;
    document.getElementById("rtag").hidden = true;
    document.getElementById("locked").hidden = false;
    return;
  }
  document.getElementById("locked").hidden = true;
  document.getElementById("rtag").textContent = data.tagline || "";
  document.getElementById("rtag").hidden = !data.tagline;
  document.title = (data.name || "Menu") + " Menu";
  var html = "", tabs = "";
  (data.categories || []).forEach(function (cat) {
    var items = (data.items || []).filter(function (it) { return it.cat === cat.id; })
      .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    if (!items.length) return;
    tabs += '<button type="button" class="tab" data-id="' + esc(cat.id) + '">' + esc(cat.name) + "</button>";
    html += '<section class="sec" id="sec-' + esc(cat.id) + '" data-id="' + esc(cat.id) + '">' +
      '<div class="sec-head"><h2>' + esc(cat.name) + '</h2><span class="count">' + items.length + (items.length === 1 ? " dish" : " dishes") + "</span></div>" +
      (cat.blurb ? '<p class="blurb">' + esc(cat.blurb) + "</p>" : "") +
      items.map(function (it) { return itemHTML(it, cat); }).join("") +
    "</section>";
  });
  menuEl.innerHTML = html || '<p class="blurb" style="padding-top:28px">The menu is being updated. Please check back soon.</p>';
  tabsEl.innerHTML = tabs;
  setActive(tabsEl.firstElementChild ? tabsEl.firstElementChild.dataset.id : null);
  watch();
  renderLinks(data.links);
}

function setActive(id) {
  Array.prototype.forEach.call(tabsEl.children, function (b) {
    var on = b.dataset.id === id;
    if (on) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
    if (on) tabsEl.scrollTo({ left: b.offsetLeft - 16, behavior: reduceMotion ? "auto" : "smooth" });
  });
}

function watch() {
  if (observer) observer.disconnect();
  if (!("IntersectionObserver" in window)) return;
  observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting) setActive(e.target.dataset.id); });
  }, { rootMargin: "-110px 0px -70% 0px", threshold: 0 });
  Array.prototype.forEach.call(menuEl.children, function (s) { observer.observe(s); });
}

tabsEl.addEventListener("click", function (e) {
  var b = e.target.closest(".tab");
  if (!b) return;
  var sec = document.getElementById("sec-" + b.dataset.id);
  if (sec) sec.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
  setActive(b.dataset.id);
});

function note(msg, done) {
  if (done) ready();
  document.getElementById("locked").hidden = true;
  menuEl.innerHTML = '<p class="blurb" style="padding-top:28px">' + esc(msg) + "</p>";
  tabsEl.innerHTML = "";
  document.getElementById("links").hidden = true;
}
function notFound() {
  document.getElementById("rname").textContent = "Menu not found";
  document.getElementById("rtag").hidden = true;
  document.title = "Menu not found";
  note("We could not find this menu. Please check the link or scan the QR code again.", true);
}

// Each phone keeps the last menu it saw. Within 5 minutes it does not ask the database at all,
// which saves the free daily limit. After that it fetches once (no live listener).
// If the database cannot be reached, the saved menu is shown instead of an error.
// Add &fresh=1 to a link to skip the saved copy (the admin "View menu" button does).
var TTL = 5 * 60 * 1000;
var CKEY = "menu:" + RID;
var FRESH = /[?&]fresh=1(&|$)/.test(location.search);
function readCache() {
  try { var c = JSON.parse(localStorage.getItem(CKEY) || "null"); return c && c.data && c.t ? c : null; }
  catch (e) { return null; }
}
function writeCache(data) { try { localStorage.setItem(CKEY, JSON.stringify({ t: Date.now(), data: data })); } catch (e) {} }

(async function () {
  var cached = readCache();
  if (cached) render(cached.data); else note("Loading menu...");
  if (cached && !FRESH && Date.now() - cached.t < TTL) return;
  try {
    var F = await start({});
    var fs = F.fs, db = F.db;
    var r = await fs.getDoc(fs.doc(db, "restaurants", RID));
    if (!r.exists()) { try { localStorage.removeItem(CKEY); } catch (e) {} notFound(); return; }
    var s = await fs.getDocs(fs.collection(db, "restaurants", RID, "items"));
    var rd = r.data();
    var data = { name: rd.name, tagline: rd.tagline, categories: rd.categories || [], items: s.docs.map(function (d) { return d.data(); }), links: rd.links, theme: rd.theme || null, sub: rd.sub || null };
    if (!cached || JSON.stringify(cached.data) !== JSON.stringify(data)) render(data);
    writeCache(data);
  } catch (e) {
    console.warn(e);
    if (!cached) note("The menu could not load. Check your internet and refresh.", true);
  }
})();
</script>
</body>
</html>
