<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Print QR codes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: controls on top, then a grid of table cards. Each card is A6 (105 x 148 mm) so four fit on an A4 sheet, or one fills an A5 card. Sizes inside a card are in em, so the card scales. */
:root {
  --bg: #FFF1DC; --surface: #FFF8EC; --ink: #2A160E; --muted: #7B5B4C; --line: #EBCFA9;
  --bar: #8E1409; --saffron: #F4A300; --on-saffron: #2A160E; --field: #FFFDF8; --bad: #B5200F;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1D110B; --surface: #2A1912; --ink: #FBEAD3; --muted: #C9A892; --line: #4A3226; --bar: #5E1209; --saffron: #FFB830; --field: #231610; --bad: #FF7A5C; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
[hidden] { display: none !important; }
h1, h2, p { margin: 0; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left, 0px)); }
.ui { padding-block: 22px 8px; display: flex; flex-direction: column; gap: 14px; }
.ui h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; letter-spacing: -0.02em; }
.muted { color: var(--muted); font-size: 0.92rem; }
.ctl { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.ctl > div { min-width: 150px; }
label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 4px; }
input, select { font: inherit; color: var(--ink); width: 100%; min-height: 44px; padding: 9px 12px; background: var(--field); border: 1.5px solid var(--line); border-radius: 10px; }
.btn { font: inherit; font-weight: 700; font-size: 0.95rem; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.btn.primary { background: var(--saffron); border-color: var(--saffron); color: var(--on-saffron); }
.btn.small { min-height: 38px; font-size: 0.85rem; padding: 0 12px; }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }
.note { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.err { color: var(--bad); font-weight: 600; }

.grid { display: flex; flex-wrap: wrap; gap: 18px; padding-block: 12px 40px; }
.cell { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.cell .btn { align-self: stretch; }

/* One card, A6. */
.card {
  --k: 1;
  font-size: calc(4mm * var(--k));
  width: 26.25em; height: 37em;
  background: #FFFFFF; color: #1B1B1B;
  border-radius: 1.2em; overflow: hidden;
  display: flex; flex-direction: column; align-items: center;
  font-family: var(--font-body);
  box-shadow: 0 0.2em 1.2em rgba(0, 0, 0, 0.18);
}
.card { position: relative; -webkit-print-color-adjust: exact; print-color-adjust: exact; background: var(--tbg, #FFFFFF); }
.card .bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.card > :not(.bg) { position: relative; }
.card .panel { display: contents; }
.card.t .band { width: calc(100% - 5em); margin-top: 1.2em; background: #FFFFFF; color: #1B1B1B; border-radius: 1em; padding: 0.9em 1em 0.8em; box-shadow: 0 0.15em 0.5em rgba(0,0,0,0.25); }
.card.t .band .nm { color: var(--cbar, #8E1409); font-size: 1.5em; }
.card.t .logo { border: 0.12em solid var(--cacc, #F4A300); }
.card.t .panel { display: flex; flex-direction: column; align-items: center; background: #FFFFFF; border-radius: 1em; width: calc(100% - 7.2em); margin-top: 1em; padding: 0.7em 0.5em 0.9em; box-shadow: 0 0.15em 0.5em rgba(0,0,0,0.25); }
.card.t .ask { margin-top: 0; font-size: 1.3em; }
.card.t canvas { width: 13.6em; height: 13.6em; margin-top: 0.35em; }
.card.t .tbl { margin-top: 0.6em; font-size: 1.6em; }
.card.t .ft { color: var(--tfg, #FFFFFF); background: var(--tfb, rgba(0,0,0,0.4)); padding: 0.25em 0.9em; border-radius: 999px; margin-bottom: 0.8em; }
.card .band {
  width: 100%; background: var(--cbar, #8E1409); color: var(--con, #FFF8EF); padding: 1.3em 1.2em 1.1em; display: flex; flex-direction: column; align-items: center; gap: 0.5em; text-align: center; }
.card .logo { width: 4.6em; height: 4.6em; border-radius: 50%; background: #FFFFFF; display: grid; place-items: center; overflow: hidden; }
.card .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.card .nm { font-family: var(--font-display); font-weight: 800; font-size: 1.7em; line-height: 1.05; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.card .ask { font-family: var(--font-display); font-weight: 800; font-size: 1.55em; margin-top: 0.7em; color: var(--cbar, #8E1409); }
.card canvas { width: 17.5em; height: 17.5em; margin-top: 0.5em; display: block; }
.card .tbl { margin-top: 0.7em; background: var(--cacc, #F4A300); color: var(--coa, #2A160E); font-family: var(--font-display); font-weight: 800; font-size: 1.9em; line-height: 1; padding: 0.3em 1.1em; border-radius: 999px; }
.card .ft { margin-top: auto; padding-bottom: 0.9em; font-size: 0.72em; color: #6A6A6A; letter-spacing: 0.04em; }

@media print {
  @page { margin: 0; }
  body { background: #FFF; }
  .ui, .cell .btn, .note { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .grid { padding: 0; gap: 0; display: block; }
  .cell { display: inline-block; vertical-align: top; }
  .card { box-shadow: none; border-radius: 0; outline: 0.2mm dashed #BBB; outline-offset: -0.2mm; }
  body.sheet .cell { width: 105mm; height: 148mm; }
  body.page .cell { display: block; width: 148mm; height: 210mm; page-break-after: always; }
  body.page .card { --k: 1.4095; }
}
</style>
<style id="pageRule">@page { size: A4; }</style>
</head>
<body class="sheet">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>

      <path d="M11 8 Q8 4 11 0 M17 8 Q14 3 17 -1 M23 8 Q20 4 23 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
      <ellipse cx="17" cy="29" rx="14" ry="3.4" fill="#C98B4B"/>
      <path d="M5 11 H29 V19 Q29 27 17 27 Q5 27 5 19 Z" fill="#F3E2C7"/>
      <path d="M29 13 Q36 13 35 19 Q34 24 28 23" fill="none" stroke="#F3E2C7" stroke-width="2.4" stroke-linecap="round"/>
      <ellipse cx="17" cy="11" rx="12" ry="2.6" fill="#6B3E26"/>
    </symbol>
    <symbol id="s-bean" viewBox="0 0 12 16">
      <ellipse cx="6" cy="8" rx="5" ry="7.5" fill="#C98B4B"/>
      <path d="M6 1 Q9.5 8 6 15" fill="none" stroke="#3A2216" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>
    <symbol id="s-bowl" viewBox="0 0 36 30">
      <ellipse cx="18" cy="12" rx="13" ry="8" fill="#FFF1CF"/>
      <circle cx="11" cy="9" r="1" fill="#E3B04B"/><circle cx="17" cy="7" r="1" fill="#E3B04B"/><circle cx="23" cy="10" r="1" fill="#E3B04B"/><circle cx="14" cy="13" r="1" fill="#E3B04B"/><circle cx="21" cy="14" r="1" fill="#E3B04B"/>
      <path d="M2 14 H34 Q33 28 18 28 Q3 28 2 14 Z" fill="#F6E3C1"/>
      <path d="M6 18 H30" stroke="#C0392B" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="s-chili" viewBox="0 0 30 14">
      <path d="M2 10 Q14 1 28 7 Q16 14 2 10 Z" fill="#E4472B"/>
      <path d="M28 7 Q30 4 29 2" fill="none" stroke="#3E8E41" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="s-star" viewBox="0 0 20 20">
      <path d="M10 1 L12.2 7.8 L19 10 L12.2 12.2 L10 19 L7.8 12.2 L1 10 L7.8 7.8 Z" fill="#E3B04B"/>

      <path d="M1 6 Q10 -3 19 6 Q10 15 1 6 Z" fill="#4FA35B"/>

    </symbol>
    <symbol id="s-cupcake" viewBox="0 0 30 34">
      <path d="M5 16 H25 L22 31 H8 Z" fill="#C98B4B"/>

      <ellipse cx="15" cy="15" rx="12" ry="4.2" fill="#FFFFFF"/>
      <ellipse cx="15" cy="10.5" rx="9" ry="3.8" fill="#FFFFFF"/>
      <ellipse cx="15" cy="6.4" rx="5.5" ry="3.2" fill="#FFFFFF"/>

      <path d="M2 16 Q4 4 20 3 Q36 4 38 16 Q34 11 30 12 Q26 7 20 8 Q14 7 10 12 Q6 11 2 16 Z" fill="#E0A458"/>
      <path d="M14 5 Q15 9 13 12 M20 3 V9 M26 5 Q25 9 27 12" stroke="#B87722" stroke-width="1" fill="none" stroke-linecap="round"/>

      <ellipse cx="3" cy="19" rx="2.2" ry="3.6" fill="#D9A441" transform="rotate(-25 3 19)"/>

      <circle cx="15" cy="15" r="14" fill="#FFFFFF"/>

    <symbol id="s-glass" viewBox="0 0 24 40">
      <path d="M15 2 L18 -4" stroke="#2E7D45" stroke-width="2" stroke-linecap="round"/>
      <path d="M3 6 H21 L19 36 Q19 38 17 38 H7 Q5 38 5 36 Z" fill="#FFF3D6" fill-opacity="0.9"/>
      <path d="M4.3 16 H19.7 L18.4 35 Q18.4 36.4 17 36.4 H7 Q5.6 36.4 5.6 35 Z" fill="#FFA62B"/>

    <symbol id="s-berry" viewBox="0 0 16 16">
      <circle cx="8" cy="9" r="6" fill="#C2185B"/>
      <circle cx="6" cy="7.5" r="1" fill="#F48FB1"/>

  </defs>
</svg>
<div class="wrap">
  <section class="ui">
    <h1 id="ttl">QR codes</h1>
    <p class="muted" id="sub"></p>
    <div id="msg" class="note" hidden></div>
    <div class="ctl" id="ctl" hidden>
      <div id="tblBox"><label for="nTables">Number of tables</label><input id="nTables" type="number" min="1" max="99" value="10" inputmode="numeric"></div>
      <div><label for="theme">Card design</label>
        <select id="theme"><option value="plain">Plain</option><option value="coffee">Coffee shop</option><option value="biryani">Biryani and grills</option><option value="bakery">Bakery and sweets</option><option value="juice">Juice and shakes</option></select></div>
      <div><label for="layout">Print layout</label>
        <select id="layout"><option value="sheet">4 cards on an A4 sheet</option><option value="page">1 big card per page (A5)</option></select></div>
      <button id="print" class="btn primary" type="button">Print all</button>
    </div>
    <p class="muted" id="hint" hidden>Tip: in the print window choose "Save as PDF" to keep a copy, and turn off "Headers and footers".</p>
  </section>
  <div class="grid" id="grid"></div>
</div>

<script type="module">
import { RID, start } from "./firebase-config.js";
import { drawQR } from "./qr.js";
import { themeVars, validTheme, DEFAULT_THEME, isPremium, safeImg } from "./shared.js";

var $ = function (id) { return document.getElementById(id); };
function esc(t) {
  return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
var rest = null, logoImg = null;

// Each design: background colour, footer text colour, and the little pictures drawn around the edges (symbol id, x, y, width, rotation) on a 105 x 148 sheet.
var THEMES = {
  plain: null,
  coffee: { bg: "#3A2216", fg: "#F3E2C7", fb: "rgba(0,0,0,0.45)", art: [["cup", -6, 118, 36, -12], ["cup", 78, 2, 34, 14], ["cup", 84, 112, 30, 8], ["cup", -4, 4, 26, -10], ["bean", 30, 134, 10, 30], ["bean", 62, 138, 9, -20], ["bean", 92, 60, 9, 25], ["bean", 3, 66, 9, -25], ["bean", 46, 1, 9, 160], ["bean", 74, 100, 8, 70], ["bean", 20, 104, 8, -60]] },
  biryani: { bg: "#8A2412", fg: "#FFE9C7", fb: "rgba(0,0,0,0.35)", art: [["bowl", -8, 116, 40, -8], ["bowl", 76, 4, 38, 10], ["chili", 66, 128, 34, -20], ["chili", -4, 8, 32, 20], ["star", 88, 66, 14, 15], ["star", 4, 72, 14, -10], ["star", 44, 2, 11, 30], ["leaf", 40, 136, 18, 10], ["leaf", 94, 100, 16, 80], ["leaf", 0, 98, 16, -70]] },
  bakery: { bg: "#F7D5D8", fg: "#6A3A1E", fb: "rgba(255,255,255,0.75)", art: [["cupcake", -6, 112, 32, -10], ["cupcake", 82, 2, 28, 12], ["croissant", 62, 128, 44, -8], ["croissant", -8, 4, 40, 10], ["wheat", 92, 66, 12, 12], ["wheat", 2, 70, 12, -12], ["berry", 40, 134, 9, 0], ["berry", 50, 2, 8, 0], ["berry", 94, 112, 8, 0]] },
  juice: { bg: "#F58A1F", fg: "#FFFFFF", fb: "rgba(0,0,0,0.28)", art: [["orange", -8, 116, 36, 0], ["orange", 80, 2, 34, 20], ["glass", 84, 104, 20, 8], ["glass", 2, 2, 17, -10], ["leaf", 40, 134, 18, 10], ["leaf", 64, 136, 16, -20], ["berry", 92, 62, 10, 0], ["berry", 4, 70, 10, 0], ["leaf", 44, 0, 16, 160]] }
};
function themeArt(name) {
  var t = THEMES[name]; if (!t) return "";
  var uses = t.art.map(function (a) {
    var w = a[3], h = w * (a[0] === "glass" ? 1.66 : a[0] === "wheat" ? 3 : a[0] === "cupcake" ? 1.13 : a[0] === "croissant" ? 0.5 : a[0] === "chili" ? 0.47 : a[0] === "bowl" ? 0.83 : a[0] === "leaf" ? 0.6 : a[0] === "bean" ? 1.33 : 1);
    return '<use href="#s-' + a[0] + '" x="' + a[1] + '" y="' + a[2] + '" width="' + w + '" height="' + h + '" transform="rotate(' + a[4] + " " + (a[1] + w / 2) + " " + (a[2] + h / 2) + ')" style="color:' + t.fg + '"/>';
  }).join("");
  return '<svg class="bg" viewBox="0 0 105 148" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">' + uses + "</svg>";
}
var theme = "plain";
try { theme = new URLSearchParams(location.search).get("theme") || localStorage.getItem("qrtheme:" + RID) || "plain"; } catch (e) {}
if (!(theme in THEMES)) theme = "plain";

(async function () {
  try {
    var F = await start({});
    var snap = await F.fs.getDoc(F.fs.doc(F.db, "restaurants", RID));
    if (!snap.exists()) { say("We could not find this cafe. Check the link."); return; }
    rest = snap.data();
  } catch (e) { say("Could not load. Check your internet and refresh."); return; }
  var src = safeImg(rest.logo);
  if (src) {
    logoImg = await new Promise(function (res) { var im = new Image(); im.onload = function () { res(im); }; im.onerror = function () { res(null); }; im.src = src; });
  }
  $("ttl").textContent = (rest.name || "Cafe") + " QR codes";
  var prem = isPremium(rest);
  $("sub").textContent = prem ? "One card per table. Customers scan, see the menu and order from that table." : "Your menu QR code. Table QR codes with ordering are part of the Premium plan.";
  $("tblBox").hidden = !prem;
  $("nTables").value = Math.max(1, Math.min(99, parseInt(rest.tables, 10) || 10));
  $("ctl").hidden = false; $("hint").hidden = false;
  draw();
})();

function say(t) { var m = $("msg"); m.textContent = t; m.hidden = false; m.className = "note err"; }

function link(t) {
  var u = new URL("index.html", location.href);
  u.searchParams.set("r", RID);
  if (t) u.searchParams.set("t", t);
  return u.href;
}

function draw() {
  var prem = isPremium(rest);
  var n = prem ? Math.max(1, Math.min(99, parseInt($("nTables").value, 10) || 1)) : 0;
  var th = themeVars(validTheme(rest.theme) || DEFAULT_THEME).vars;
  var cells = [];
  if (prem) for (var i = 1; i <= n; i++) cells.push({ t: String(i), label: "Table " + i });
  else cells.push({ t: "", label: "" });
  var tt = THEMES[theme];
  $("grid").innerHTML = cells.map(function (c, i) {
    return '<div class="cell"><div class="card' + (tt ? " t" : "") + '" style="--cbar:' + th["--bar"] + ";--con:" + th["--on-bar"] + ";--cacc:" + th["--saffron"] + ";--coa:" + th["--on-saffron"] + (tt ? ";--tbg:" + tt.bg + ";--tfg:" + tt.fg + ";--tfb:" + tt.fb : "") + '">' +
      themeArt(theme) +
      '<div class="band">' + (logoImg ? '<div class="logo"><img alt="" src="' + esc(logoImg.src) + '"></div>' : "") + '<div class="nm">' + esc(rest.name || "Menu") + "</div></div>" +
      '<div class="panel"><div class="ask">' + (prem ? "Scan to order" : "Scan for our menu") + "</div>" +
      '<canvas data-i="' + i + '" aria-label="QR code' + (c.label ? " for " + esc(c.label) : "") + '"></canvas>' +
      (c.label ? '<div class="tbl">' + esc(c.label) + "</div>" : "") + "</div>" +
      '<div class="ft">Menu by Brand Boost Studio</div></div>' +
      '<button class="btn small" type="button" data-dl="' + i + '">Download QR image</button></div>';
  }).join("");
  Array.prototype.forEach.call($("grid").querySelectorAll("canvas"), function (cv) {
    var c = cells[+cv.dataset.i];
    drawQR(cv, link(c.t), { size: 720, logo: logoImg || null, dark: "#111111" });
  });
  cells._ = cells; window.__cells = cells;
}

$("theme").value = theme;
$("theme").addEventListener("change", function () {
  theme = $("theme").value;
  try { localStorage.setItem("qrtheme:" + RID, theme); } catch (e) {}
  if (rest) draw();
});
$("nTables").addEventListener("input", function () { if (rest) draw(); });
$("layout").addEventListener("change", function () {
  var v = $("layout").value;
  document.body.className = v;
  $("pageRule").textContent = v === "page" ? "@page { size: A5; }" : "@page { size: A4; }";
});
$("print").addEventListener("click", function () { window.print(); });
$("grid").addEventListener("click", function (e) {
  var b = e.target.closest("[data-dl]");
  if (!b) return;
  var cv = $("grid").querySelector('canvas[data-i="' + b.dataset.dl + '"]');
  var c = window.__cells[+b.dataset.dl];
  var a = document.createElement("a");
  a.download = (RID + (c.t ? "-table-" + c.t : "-menu") + "-qr.png");
  a.href = cv.toDataURL("image/png");
  a.click();
});
</script>
</body>
</html>
